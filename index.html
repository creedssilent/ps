<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — IRGT Inventory System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

<div class="auth-card">
    <div class="card-header">
        <div class="logo-box">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
        </div>
        <div class="badge-brand">IRGT INVENTORY SYSTEM</div>
        <h1>Selamat Datang</h1>
        <p class="subtitle">Masuk untuk mengelola inventaris aset sekolah</p>
    </div>

    <div id="alert-box" class="alert-error" style="display:none;"><ul><li id="alert-text"></li></ul></div>

    <form id="login-form">
        <div class="form-group">
            <label for="email">Alamat Email</label>
            <div class="input-wrap">
                <span class="input-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg></span>
                <input type="email" id="email" placeholder="nama@irgtschool.id" autocomplete="username" required autofocus>
            </div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrap">
                <span class="input-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                <button type="button" class="pw-toggle" onclick="togglePw()">
                    <svg id="pw-show-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    <svg id="pw-hide-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </button>
            </div>
        </div>

        <button type="submit" class="btn-submit" id="btn-login">Masuk ke Sistem</button>

        <div class="card-footer">
            <div style="margin-bottom:12px; font-size:13.5px; color:#64748b;">
                Belum memiliki akun? <a href="register.html" style="color:#0369a1; font-weight:700; text-decoration:none;">Daftar di sini</a>
            </div>
        </div>
    </form>
</div>

<div class="site-footer">&copy; 2026 IRGT School. All rights reserved.</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
function togglePw() {
    const pw = document.getElementById('password');
    const showIcon = document.getElementById('pw-show-icon');
    const hideIcon = document.getElementById('pw-hide-icon');
    if (pw.type === 'password') { pw.type = 'text'; showIcon.style.display = 'none'; hideIcon.style.display = 'block'; }
    else { pw.type = 'password'; showIcon.style.display = 'block'; hideIcon.style.display = 'none'; }
}

function showAlert(msg) {
    document.getElementById('alert-text').textContent = msg;
    document.getElementById('alert-box').style.display = 'block';
}

// Kalau sudah login, langsung lempar ke dashboard
auth.onAuthStateChanged(user => {
    if (user) window.location.href = 'dashboard.html';
});

document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btn-login');
    btn.disabled = true;
    btn.textContent = 'Memproses...';
    try {
        await auth.signInWithEmailAndPassword(email, password);
        window.location.href = 'dashboard.html';
    } catch (err) {
        const map = {
            'auth/invalid-credential': 'Email atau password salah.',
            'auth/user-not-found': 'Akun tidak ditemukan.',
            'auth/wrong-password': 'Password salah.',
            'auth/invalid-email': 'Format email tidak valid.',
            'auth/too-many-requests': 'Terlalu banyak percobaan, coba lagi nanti.'
        };
        showAlert(map[err.code] || 'Gagal masuk: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Masuk ke Sistem';
    }
});
</script>
</body>
</html>
